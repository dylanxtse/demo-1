<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>退货单维护 - 集采企业版企业端</title>
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/layout.css?v=20260909-global-tooltip-2">
  <link rel="stylesheet" href="./assets/css/components.css?v=20260909-placeholder-gray-1">
  <link rel="stylesheet" href="./assets/css/product-list.css?v=20260831-record-sync-1">
  <link rel="stylesheet" href="./assets/css/warehouse.css">
  <link rel="stylesheet" href="./assets/css/operations.css?v=20260731-7">
  <link rel="stylesheet" href="./assets/css/order-lists.css?v=20260921-return-entry-1">
  <link rel="stylesheet" href="./assets/css/processing.css?v=20260731-7">
  <link rel="stylesheet" href="./assets/css/order-form.css?v=20260731-7">
  <link rel="stylesheet" href="./assets/css/product-picker.css?v=20260921-return-product-picker-1">
  <link rel="stylesheet" href="./assets/css/order-return-form.css?v=20260921-return-filter-layout-1">
</head>
<body>
  <div id="app"></div>
  <template id="returnFormTemplate">
    <div class="page-card order-form-page return-form-page">
      <div class="order-form-header">
        <button class="back-link" type="button" data-action="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/><path d="M19 12H9"/></svg>
          <span>返回</span>
        </button>
        <h1 id="returnPageTitle">添加退货单</h1>
      </div>
      <div class="order-form-status" id="returnStatus" role="status"></div>
      <form class="order-form" id="returnForm" novalidate>
        <section class="order-form-section">
          <div class="order-form-grid return-basic-grid">
            <div class="order-form-field">
              <label class="field-label required" for="returnMode">退货方式</label>
              <select class="form-control filter-select" id="returnMode"><option value="" selected disabled hidden>请选择退货方式</option><option value="RELATED">关联订单</option><option value="UNRELATED">不关联订单</option></select>
              <span class="field-error" data-error-for="returnMode"></span>
            </div>
            <div class="order-form-field return-customer-field">
              <label class="field-label required" for="customerName">客户</label>
              <select class="form-control filter-select" id="customerName"><option value="" selected disabled hidden>请选择客户</option><option value="第一实验学校">第一实验学校</option><option value="阳光幼儿园">阳光幼儿园</option></select>
              <span class="field-error" data-error-for="customerName"></span>
            </div>
            <div class="order-form-field return-canteen-field">
              <label class="field-label required" for="canteen">食堂</label>
              <select class="form-control filter-select" id="canteen"><option value="" selected disabled hidden>请选择食堂</option><option value="第一食堂">第一食堂</option><option value="园区食堂">园区食堂</option></select>
              <span class="field-error" data-error-for="canteen"></span>
            </div>
            <div class="order-form-field return-reason-field">
              <label class="field-label" for="reason">退货原因</label>
              <div class="return-reason-picker">
                <input class="form-control return-reason-input" id="reason" autocomplete="off" placeholder="请输入退货原因">
                <div class="return-reason-menu" id="returnReasonMenu" role="listbox" aria-label="退货原因选项" hidden>
                  <button type="button" data-reason-option="买多了">买多了</button>
                  <button type="button" data-reason-option="质量问题">质量问题</button>
                  <button type="button" data-reason-option="价格问题">价格问题</button>
                  <button type="button" data-reason-option="不想要了">不想要了</button>
                  <button type="button" data-reason-option="其他原因">其他原因</button>
                </div>
              </div>
              <span class="field-error" data-error-for="reason"></span>
            </div>
            <div class="order-form-field return-order-field" hidden>
              <label class="field-label required" for="orderNo">关联订单</label>
              <input class="form-control" id="orderNo" readonly placeholder="请选择订单">
              <span class="field-error" data-error-for="orderNo"></span>
            </div>
            <div class="order-form-field return-damage-field" hidden>
              <label class="field-label" for="includeDamage">包含报损数量</label>
              <select class="form-control filter-select" id="includeDamage"><option>否</option><option>是</option></select>
            </div>
            <div class="order-form-field return-attachment-field" hidden>
              <label class="field-label">附件</label>
              <div class="attachment-control"><button class="btn btn-sm" id="uploadAttachment" type="button">上传附件</button><span id="attachmentName">未上传</span></div>
            </div>
          </div>
        </section>
        <div class="return-order-action" id="returnOrderAction">
          <button class="btn btn-primary btn-sm" id="chooseOrder" type="button">选择订单</button>
          <span class="return-selected-order" id="returnSelectedOrderNo" hidden></span>
        </div>
        <section class="order-form-section goods-section">
          <div class="return-goods-toolbar" id="returnGoodsToolbar" hidden>
            <button class="btn btn-primary btn-sm" id="addReturnGoods" type="button" hidden>添加商品</button>
          </div>
          <div class="order-goods-table-wrap"><table class="order-goods-table return-goods-table">
            <thead><tr><th>序号</th><th>图片</th><th>商品名称（计量单位/品牌/规格）</th><th>计量单位</th><th>下单单价</th><th>发货数量</th><th>已退数</th><th class="return-quantity-head">申请退货数量 <span class="return-help-mark" aria-label="申请退货数量不能超过可退数量">?</span></th><th>申请退货单价</th><th>申请退货金额</th><th>报损数量</th><th>关联采购单</th><th>备注</th></tr></thead>
            <tbody id="returnGoodsBody"><tr><td class="empty-goods" colspan="13">请选择关联订单</td></tr></tbody>
            <tfoot id="returnGoodsFoot"><tr><td>合计</td><td colspan="12"></td></tr></tfoot>
          </table></div>
          <div class="goods-table-error" id="returnGoodsError"></div>
        </section>
        <section class="order-remark-section return-remark-section">
          <label class="field-label" for="returnRemark">订单备注</label>
          <div class="remark-input-wrap">
            <textarea class="form-control" id="returnRemark" maxlength="100"></textarea>
            <span class="remark-count" id="returnRemarkCount">0/100</span>
          </div>
        </section>
      </form>
      <div class="order-form-actions">
        <button class="btn btn-primary" id="returnCancel" type="button" data-action="back">取消</button>
        <button class="btn btn-danger" id="returnReject" data-action="reject">驳回</button>
        <button class="btn btn-primary" id="returnPrimary" data-action="save">保存退货单</button>
      </div>
      <div id="returnOverlay"></div>
    </div>
  </template>
  <script src="./assets/js/config/menu-data.js?v=20260819-menu-guard-3"></script>
  <script src="./assets/js/components/navigation-guard.js?v=20260819-navigation-2"></script><script src="./assets/js/components/header.js?v=20260819-navigation-2"></script>
  <script src="./assets/js/components/page-tabs.js?v=20260819-navigation-2"></script>
  <script src="./assets/js/components/sidebar.js?v=20260819-navigation-2"></script>
  <script src="./assets/js/components/app-shell.js?v=20260819-navigation-2"></script>
  <script src="./assets/js/utils/dom.js"></script>
  <script src="./assets/js/utils/business-rules.js"></script>
  <script src="./assets/js/utils/storage.js"></script>
  <script src="./assets/js/services/repository.js"></script><script src="./assets/js/data/mock-dataset.js"></script>

  <script src="./assets/js/services/operations-service.js?v=20260831-record-sync-1"></script>
  <script src="./assets/js/components/date-range-picker.js?v=20260921-return-date-range-1"></script>
  <script src="./assets/js/pages/order-return-form.js?v=20260921-return-selected-order-1"></script>
</body>
</html>
